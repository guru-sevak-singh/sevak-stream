<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ app_name }}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f3;
      font-family: sans-serif;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e5e3;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 13px;
      color: #888;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      background: #e8f5ee;
      color: #1a7a45;
      border: 1px solid #b6dfc8;
    }

    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e0e0de;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 1.5rem;
      outline: none;
    }

    input:focus {
      border-color: #aaa;
    }

    .divider {
      font-size: 12px;
      color: #bbb;
      text-align: center;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: #eee;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 10px 0;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #f5f5f3;
    }

    button.primary {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    button.primary:hover {
      opacity: 0.88;
    }

    .status {
      margin-top: 1.25rem;
      font-size: 13px;
      color: #888;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <p class="logo">{{ app_name }}</p>
    <p class="tagline">Live sessions. Recorded. Summarised.</p>
    <span class="badge">Phase 0 — foundation</span>

    <label>Session ID</label>
    <input type="text" id="session-id" placeholder="Enter session ID" value="session-12345" />

    <label>Your name</label>
    <input type="text" id="user-name" placeholder="Enter your name" value="Guru Sevak Singh"/>

    <div class="divider">join as</div>

    <div class="btns">
      <button class="primary" onclick="handleJoin('teacher')">Teacher</button>
      <button onclick="handleJoin('student')">Student</button>
    </div>

    <p class="status" id="status"></p>
  </div>

  <script src="/static/js/main.js"></script>
</body>

</html>
